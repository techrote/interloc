<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interloc IL-012 WebGL Fixture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { width: 100%; height: 100%; display: block; }
    #tag { position: fixed; left: 16px; top: 12px; padding: 6px 10px; background: #000; color: #fff; font: 18px monospace; }
  </style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="tag">INTERLOC IL-012 WEBGL</div>
<script>
"use strict";
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", {antialias: false, preserveDrawingBuffer: true});
if (!gl) {
  document.getElementById("tag").textContent = "WEBGL2 UNAVAILABLE";
  throw new Error("WebGL2 unavailable");
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.floor(innerWidth * dpr));
  canvas.height = Math.max(1, Math.floor(innerHeight * dpr));
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);
resize();

const vs = `#version 300 es
in vec2 p;
in vec3 c;
out vec3 color;
void main(){ color=c; gl_Position=vec4(p,0.0,1.0); }`;
const fs = `#version 300 es
precision highp float;
in vec3 color;
out vec4 outColor;
void main(){ outColor=vec4(color,1.0); }`;

function shader(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, vs));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const data = new Float32Array([
  -0.90,-0.80, 1,0,0,   -0.10,-0.80, 0,1,0,   -0.50, 0.75, 0,0,1,
   0.10,-0.80, 1,1,0,    0.90,-0.80, 0,1,1,    0.50, 0.75, 1,0,1
]);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
const stride = 5 * 4;
const p = gl.getAttribLocation(program, "p");
const c = gl.getAttribLocation(program, "c");
gl.enableVertexAttribArray(p);
gl.vertexAttribPointer(p, 2, gl.FLOAT, false, stride, 0);
gl.enableVertexAttribArray(c);
gl.vertexAttribPointer(c, 3, gl.FLOAT, false, stride, 2 * 4);

gl.clearColor(0.08, 0.08, 0.10, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLES, 0, 6);
gl.finish();
</script>
</body>
</html>
