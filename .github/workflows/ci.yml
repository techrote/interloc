name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked test inputs
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - name: Retain reproducible source snapshot
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: source-snapshot.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          interloc --help
          interloc doctor --json
      - name: Planning workflow audit
        run: python tools/audit_workflow.py
